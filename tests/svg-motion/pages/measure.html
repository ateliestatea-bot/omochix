// Harness for csp-tests.js: the real measuring frame (/theme/assets/svg-motion/measure-frame.html), driven from the test.
window.H = {
  async prepared(text) { const data = await loadData(); const prep = s => OmxSvgFrame.prepare(s, Object.assign({ overlay: false }, data.budget || {})); const r = await OmxSvgImport.fromText(text, { prepare: prep }); return prep(r.svg).svg; },
