<!doctype html><html><head><meta charset=utf-8><title>Safari クリック計測</title><script src="head.js"></script><style>body{font:16px system-ui;margin:24px}iframe{width:480px;height:270px;border:2px solid #6e4bff;display:block}#s{font-size:18px;margin:12px 0}</style></head><body><h1>Safari の枠内クリック計測</h1><p id=s>10 秒待つと案内が変わります。そのまま待ってください。</p><div id=h></div><script>
// For a person using real Safari: 10 s untouched, then click once inside the frame, then 10 s more. Posts the timeline.
const n = 'n' + Math.random().toString(36).slice(2), f = document.createElement('iframe'); f.setAttribute('sandbox', 'allow-scripts');
f.srcdoc = '<!doctype html><html><head><meta http-equiv="Content-Security-Policy" content="default-src \'none\'; script-src \'nonce-' + n + '\'; style-src \'unsafe-inline\'"></head><body style="margin:0"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 90"><g id=g><circle cx="80" cy="45" r="20" fill="#6e4bff"/></g></svg>' + SC + ' nonce="' + n + '">document.getElementById("g").animate([{transform:"translateX(-50px)"},{transform:"translateX(50px)"}],{duration:1000,iterations:Infinity,direction:"alternate"});var c=0;(function t(){c++;requestAnimationFrame(t)})();setInterval(function(){parent.postMessage({rate:c},"*");c=0},1000);document.addEventListener("click",function(){parent.postMessage({clicked:1},"*")});' + SE + '</body></html>';
const log = []; let clickedAt = null; addEventListener('message', e => { if (e.source !== f.contentWindow) return; if (e.data.clicked && clickedAt === null) { clickedAt = log.length; s.textContent = 'クリックを受け取りました。あと 10 秒お待ちください。'; setTimeout(async () => { await post('safari-click-' + engine, { engine, ua: navigator.userAgent, clickedAtSecond: clickedAt, rates: log }); s.textContent = '完了しました。このタブを閉じてかまいません。'; document.title = 'DONE'; }, 10000); } if (e.data.rate !== undefined) log.push(e.data.rate); });
h.append(f); setTimeout(() => { if (clickedAt === null) s.textContent = '紫の枠の中を 1 回クリックしてください。'; }, 10000);
</script></body></html>
