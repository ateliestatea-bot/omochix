<!doctype html><html><head><meta charset=utf-8><title>Safari 体感比較</title><script src="head.js"></script><style>body{font:15px system-ui;margin:24px}.g{display:grid;grid-template-columns:repeat(2,minmax(0,360px));gap:16px}h2{font-size:15px;margin:0 0 6px}iframe,img{width:100%;aspect-ratio:1;border:1px solid #ccc;display:block}</style></head><body><h1>同じ動きの見比べ</h1><p>左は sandbox の枠（クリック前は約 22fps）、右は img（低下なし）です。枠の中をクリックすると、左の変化も確認できます。</p><div class=g><div><h2>sandbox 枠</h2><div id=a></div></div><div><h2>img</h2><img id=b alt=""></div></div><script>
const svg = (css) => '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120"><style>' + css + '</style><g class="k"><path d="M60 14 104 90H16Z" fill="#6e4bff"/><circle cx="60" cy="104" r="6" fill="#ff4b8b"/></g></svg>';
const css = '@keyframes m{0%{transform:rotate(0deg) scale(.6)}50%{transform:rotate(180deg) scale(1)}100%{transform:rotate(360deg) scale(.6)}}.k{transform-box:fill-box;transform-origin:center;animation:m 1.2s ease-in-out infinite}';
const f = document.createElement('iframe'); f.setAttribute('sandbox', 'allow-scripts'); f.srcdoc = '<!doctype html><html><head><meta http-equiv="Content-Security-Policy" content="default-src \'none\'; style-src \'unsafe-inline\'"></head><body style="margin:0">' + svg(css) + '</body></html>'; a.append(f);
b.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg(css));
</script></body></html>
