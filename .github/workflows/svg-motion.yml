# Browser tests for SVG Motion Studio. Kept apart from tests.yml so the repository's
# dependency-free checks stay fast. Read-only: no secrets, no deploy, no production access.
#
# One job per engine, in parallel. Pull requests run the fast profile (every security check,
# every engine; the real-time image checks on the representative logos). The full profile runs
# on release branches, on a schedule and by hand (see tests/svg-motion/export-tests.js).
#
# WebKit runs on macOS, the closest to Safari. On the runners (Linux and macOS alike) WebKit
# answered prefers-reduced-motion inside SVG images with "reduce", from the system rather than
# from the page's emulation, so every exported image form drew its still pose (PR #55). The
# macOS job turns the system setting off; export-tests.js probes what images see and fails with
# that reason if it is still on. Firefox opens three pages at once instead of six: its real-time
# image checks missed short animations under load.
#
# Each engine runs as two jobs: "core" (security, upload, fidelity, presets, page, compose, shortcode, the 53 lessons)
# and "export". Firefox's export is split in two shards (SVGM_SHARD): its real-time image checks alone took most of a
# 20-minute job (PR #55, MVP-1 run). Every check still runs exactly once per engine.
name: SVG Motion

on:
  pull_request:
    paths:
      - 'wp-theme/omochix-theme/assets/js/svg-motion/**'
      - 'wp-theme/omochix-theme/assets/data/svg-motion/**'
      - 'wp-theme/omochix-theme/assets/css/learn-svg-motion.css'
      - 'wp-theme/omochix-theme/inc/learn-svg-motion.php'
      - 'wp-theme/omochix-theme/inc/logo-motion.php'
      - 'wp-theme/omochix-theme/page-learn-svg-motion.php'
      - 'wp-theme/omochix-theme/assets/data/motion/**'
      - 'tests/svg-motion/**'
      - '.github/workflows/svg-motion.yml'
  push:
    branches:
      - 'release/**'
  schedule:
    - cron: '20 18 * * 0' # Sunday 18:20 UTC (Monday 03:20 JST)
  workflow_dispatch:
    inputs:
      profile:
        description: 'fast or full'
        type: choice
        options: [full, fast]
        default: full

permissions:
  contents: read

# A newer push to the same pull request cancels the older run; release and scheduled runs finish.
concurrency:
  group: svg-motion-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  browsers:
    name: ${{ matrix.id }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { id: chromium-core, engine: chromium, os: ubuntu-24.04, parallel: 6, steps: core, shard: '1/1' }
          - { id: chromium-export, engine: chromium, os: ubuntu-24.04, parallel: 6, steps: export, shard: '1/1' }
          - { id: firefox-core, engine: firefox, os: ubuntu-24.04, parallel: 3, steps: core, shard: '1/1' }
          - { id: firefox-export-1, engine: firefox, os: ubuntu-24.04, parallel: 3, steps: export, shard: '1/2' }
          - { id: firefox-export-2, engine: firefox, os: ubuntu-24.04, parallel: 3, steps: export, shard: '2/2' }
          - { id: webkit-core, engine: webkit, os: macos-15, parallel: 6, steps: core, shard: '1/1' }
          - { id: webkit-export, engine: webkit, os: macos-15, parallel: 6, steps: export, shard: '1/1' }
    env:
      SVGM_ENGINE: ${{ matrix.engine }}
      SVGM_PARALLEL: ${{ matrix.parallel }}
      SVGM_SHARD: ${{ matrix.shard }}
      # macOS can hold 8770 for its sharing service (seen locally); 8790 is free on both runners.
      SVGM_PORT: '8790'
      SVGM_PROFILE: ${{ github.event_name == 'pull_request' && 'fast' || (github.event_name == 'workflow_dispatch' && inputs.profile || 'full') }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          extensions: mbstring, ctype
          coverage: none
          tools: none
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.14.1'
          package-manager-cache: false
      - name: Contract, unit and shortcode checks
        if: matrix.steps == 'core'
        run: |
          php tests/svg-motion/contract.php
          node tests/svg-motion/unit.js
          php tests/svg-motion/shortcode.php
      - name: Let SVG images animate (macOS Reduce Motion off)
        if: runner.os == 'macOS'
        run: |
          defaults write com.apple.universalaccess reduceMotion -bool false || echo "could not write reduceMotion"
          echo "reduceMotion: $(defaults read com.apple.universalaccess reduceMotion 2>&1)"
      - name: Install Playwright (${{ matrix.engine }})
        working-directory: tests/svg-motion
        run: |
          npm ci
          npx playwright install --with-deps ${{ matrix.engine }}
      - name: Browser tests (${{ matrix.steps }}, ${{ env.SVGM_PROFILE }})
        working-directory: tests/svg-motion
        run: node run.js "${{ matrix.steps == 'core' && 'security,upload,fidelity,presets,page,compose,shortcode,regression' || 'export' }}"
      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: svg-motion-${{ matrix.id }}-${{ env.SVGM_PROFILE }}
          path: |
            tests/svg-motion/results/*.json
            tests/svg-motion/results/*.png
            tests/svg-motion/results/failures/
          if-no-files-found: ignore
          retention-days: 7
      - name: Keep the traces of what failed
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: svg-motion-traces-${{ matrix.id }}-${{ env.SVGM_PROFILE }}
          path: tests/svg-motion/results/trace-*.zip
          if-no-files-found: ignore
          retention-days: 7
