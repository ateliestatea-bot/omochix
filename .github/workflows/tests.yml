# Run the repository's own PHP and Node test scripts on every pull request and
# on pushes to main. Read-only: no secrets, no deploy, no production access.
name: Tests

# Every pull request (any base) and every push to main or an integration branch. 'edited'
# re-runs it when a pull request's base branch changes. The job name says which workflow it
# is ("Tests (PHP 8.1)"), so a required check cannot be met by another workflow's job.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main, 'integrate/**']
  workflow_dispatch:

permissions: {}

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # 8.1 is the minimum in the plugin and theme headers; 8.3 is current.
        php: ['8.1', '8.3']
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, ctype
          coverage: none
          tools: none

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # The JS tests only use Node built-ins; 24.14.1 is the version they pass on locally.
          node-version: '24.14.1'
          package-manager-cache: false

      - name: Lint PHP
        run: |
          status=0
          while IFS= read -r -d '' file; do
            if ! out=$(php -l "$file" 2>&1); then
              echo "$out"
              status=1
            fi
          done < <(git ls-files -z '*.php')
          exit $status

      - name: PHP tests
        run: |
          status=0
          for test in \
            tests/ai-tools-csv-update.php \
            tests/ai-tools-inline.php \
            tests/ai-tools-display-facts.php \
            tests/learn-practice/run.php \
            tests/learn-gallery/run.php \
            tests/learn-composer/run.php \
            tests/nav/run.php \
            tests/article-v2/run.php \
            tests/editorial-home/run.php \
            tests/svg-motion/shortcode.php \
            tests/seo/sitemap-ignore.php \
            tests/design-library/run.php
          do
            echo "::group::$test"
            php "$test" || status=1
            echo "::endgroup::"
          done
          exit $status

      - name: Node tests
        # Still report the JS results when an earlier step failed (the job stays
        # failed), but not when the run was cancelled.
        if: ${{ !cancelled() }}
        run: |
          status=0
          for test in \
            tests/learn-composer/core-parity.js \
            tests/learn-gallery/params-parity.js \
            tests/editorial-home/menu-contrast.js \
            tests/ai-tools-quick-edit.js \
            tests/design-library/catalog-check.js
          do
            echo "::group::$test"
            node "$test" || status=1
            echo "::endgroup::"
          done
          exit $status

      - name: Web 2.0 tests
        # The Web 2.0 hooks loader and the Knowledge Hub module (docs/web2/). Like the Node
        # tests, it still reports when an earlier step failed (the job stays failed), but not
        # when the run was cancelled. The loader reads module files with the tokenizer, so a
        # PHP without it must fail here rather than pass with every module refused.
        if: ${{ !cancelled() }}
        run: |
          php -r 'exit(function_exists("token_get_all") ? 0 : 1);' || { echo "::error::PHP has no tokenizer extension"; exit 1; }
          status=0
          for test in \
            tests/web2/hooks/run.php \
            tests/web2/hooks/regression.php \
            tests/glossary/run.php \
            tests/glossary/theme.php
          do
            echo "::group::$test"
            php "$test" || status=1
            echo "::endgroup::"
          done
          exit $status

      - name: Security layer tests
        # The always-on Web 2.0 security layer (wp-plugin/omochix-core/includes/web2/security.php,
        # docs/web2/sec/): navigation block references and the fallback menu (review N-1). Its own
        # step, so the Web 2.0 tests step above stays exactly as the inventory pins it.
        if: ${{ !cancelled() }}
        run: php tests/security/run.php
