# Industry Hub tests (OmochiX Core plugin). Kept in its own file so the shared
# tests.yml is not edited while the Labs and SVG Motion branches change it.
# Read-only: no secrets, no deploy, no production access.
name: Industry Hub

on:
  pull_request:
    paths:
      - 'wp-plugin/**'
      - 'tests/industry-hub/**'
      - 'wp-theme/omochix-theme/inc/learn-industries.php'
      - '.github/workflows/industry-hub.yml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: industry-hub-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.3']
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, ctype
          coverage: none
          tools: none

      - name: Lint new PHP
        run: |
          status=0
          while IFS= read -r -d '' file; do
            php -l "$file" >/dev/null || status=1
          done < <(git ls-files -z 'wp-plugin/*.php' 'tests/industry-hub/*.php')
          exit $status

      - name: Industry Hub tests
        run: |
          status=0
          # A missing file fails the job: a test that did not run is not a pass.
          for test in \
            tests/industry-hub/compat.php \
            tests/industry-hub/run.php \
            tests/industry-hub/term-meta.php \
            tests/industry-hub/resource.php \
            tests/industry-hub/workflow.php \
            tests/industry-hub/relations.php \
            tests/industry-hub/visibility.php \
            tests/industry-hub/theme-validate.php \
            tests/industry-hub/partial-upload.php
          do
            echo "::group::$test"
            php "$test" || status=1
            echo "::endgroup::"
          done
          exit $status
