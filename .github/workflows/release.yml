# Release gate and release tools (OmochiX Core / theme packages).
# Read-only: no secrets, no deploy, no production access. It builds packages
# in the runner's temp folder only and never uploads them.
name: Release

on:
  pull_request:
    paths:
      - 'wp-plugin/**'
      - 'wp-theme/**'
      - 'tools/release/**'
      - 'tests/release/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Release gate (PHP ${{ matrix.php }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.3']
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, ctype
          coverage: none
          tools: none

      - name: Release gate (versions, markers, scope against production)
        run: php tests/release/release-gate.php

      - name: Release tools (reproducible build, verify, plan, staged replace rehearsal)
        run: python3 -W error::ResourceWarning -m unittest discover -s tests/release -v

      - name: Build twice and verify (packages stay in the runner)
        run: |
          set -e
          out1="$RUNNER_TEMP/build1"; out2="$RUNNER_TEMP/build2"
          python3 tools/release/build.py --commit HEAD --out "$out1"
          python3 tools/release/build.py --commit HEAD --out "$out2"
          for z in "$out1"/*.zip; do cmp "$z" "$out2/$(basename "$z")"; done
          python3 tools/release/verify.py --commit HEAD --dir "$out1"
          python3 tools/release/plan.py --commit HEAD --check
