# Release gate and release tools (OmochiX Core / theme packages).
# Read-only: no secrets, no deploy, no production access. It builds packages
# in the runner's temp folder only and never uploads them.
name: Release

# When it runs (Web 2.0 CI Phase 1):
# - every pull request into main, whatever it changes (no paths filter, so the required
#   check never stays pending). 'edited' re-runs it when a pull request's base is changed
#   to main, so a result computed for another base never counts here.
# - every push to main: the merged state is checked again. This cannot stop the push
#   itself; the main ruleset (pull request required, no bypass) does that.
# - by hand.
# The job always runs and always has the same name. tools/ci/release_scope.py decides what
# it does: pull requests that change no release path (packages, release tools, CI) end
# successfully with the reason in the step summary; everything else runs the full gate.
# Pushes and manual runs always run the full gate.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: nothing at the top level, read-only contents for the job.
permissions: {}

concurrency:
  group: release-${{ github.event.pull_request.number || github.ref }}
  # Pull requests: a newer run replaces the older one. Pushes to main: every commit is checked.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    name: Release gate (PHP ${{ matrix.php }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.3']
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0   # the previous release is checked on its own commit (tests/release/expected/*.json)

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, ctype
          coverage: none
          tools: none

      - name: Release scope (what this event must check)
        id: scope
        # Only a pull request can be judged "not a release target", and only by the BASE
        # commit's tools/ci/release_scope.py: this step copies it with git archive from the
        # main tip the pull request is merged into and runs it with python3 -I. No script
        # from the pull request runs here. Every other event, and a base without the script
        # (the pull request that introduces tools/ci/), runs the full gate (fail-closed).
        # The whole script is pinned in tools/ci/required-checks.json.
        run: |
          set -euo pipefail
          base=""
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then base=$(git rev-parse --verify --quiet HEAD^1) || base=""; fi
          if [ -z "$base" ] || ! git cat-file -e "$base:tools/ci/release_scope.py" 2>/dev/null; then
            echo "RELEASE TARGET: event '$GITHUB_EVENT_NAME' without a trusted scope script on the base: the full gate runs"
            echo "target=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          dir="$RUNNER_TEMP/ci-trusted"
          rm -rf "$dir"; mkdir -p "$dir"
          git archive "$base" tools/ci | tar -x -C "$dir"
          python3 -I "$dir/tools/ci/release_scope.py" --event pull_request

      - name: Release gate (versions, markers, scope against production)
        if: steps.scope.outputs.target == 'true'
        run: php tests/release/release-gate.php

      - name: Release gate for the previous release on its own commit (Industry Hub, 2f800b2)
        if: steps.scope.outputs.target == 'true'
        run: |
          set -e
          tree="$RUNNER_TEMP/industry-hub-tree"; mkdir -p "$tree"
          git archive 2f800b2c2a7ed34f0e7d33616dbfafc9cb9f1008 wp-plugin wp-theme | tar -x -C "$tree"
          OMOCHIX_RELEASE_CONFIG=industry-hub-core-1.10.0-theme-1.29.0.json OMOCHIX_RELEASE_TREE="$tree" php tests/release/release-gate.php

      - name: Release tools (reproducible build, verify, plan, staged replace rehearsal)
        if: steps.scope.outputs.target == 'true'
        run: python3 -W error::ResourceWarning -m unittest discover -s tests/release -v

      - name: Build twice and verify (packages stay in the runner)
        if: steps.scope.outputs.target == 'true'
        run: |
          set -e
          out1="$RUNNER_TEMP/build1"; out2="$RUNNER_TEMP/build2"
          python3 tools/release/build.py --commit HEAD --out "$out1"
          python3 tools/release/build.py --commit HEAD --out "$out2"
          for z in "$out1"/*.zip; do cmp "$z" "$out2/$(basename "$z")"; done
          python3 tools/release/verify.py --commit HEAD --dir "$out1"
          python3 tools/release/plan.py --commit HEAD --check
          OMOCHIX_RELEASE_CONFIG=industry-hub-core-1.10.0-theme-1.29.0.json python3 tools/release/plan.py --commit 2f800b2c2a7ed34f0e7d33616dbfafc9cb9f1008 --check
