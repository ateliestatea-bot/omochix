<!doctype html>
<!-- Design Library video work "brand-typography" (original, fictional brand "YOMIBA", a book café). 1080x1080, 10 s.
     Typography only: the wordmark is original monoline lettering drawn as SVG paths (no font); Japanese copy uses system fonts.
     Rendered frame by frame by tools/design-library/render-video.js (Web Animations are seeked, not played in real time).
     Not shipped with the theme; only the rendered MP4/WebM/posters are. -->
<html lang="ja"><head><meta charset="utf-8"><title>brand-typography</title>
<style>
*{box-sizing:border-box;margin:0}
html,body{width:1080px;height:1080px;overflow:hidden;background:#f2ecdf;color:#12352b;font-family:"Hiragino Sans","Yu Gothic",system-ui,sans-serif}
.layer{position:absolute;inset:0}
.ease{animation-timing-function:cubic-bezier(.7,0,.2,1)}
/* scene 1 (0–2.5 s): paper, one word */
.s1 .big{position:absolute;left:96px;top:250px;font:600 300px/1 "Hiragino Mincho ProN","Yu Mincho",serif;letter-spacing:.02em;white-space:nowrap}
.s1 .big span{display:inline-block;clip-path:inset(100% 0 0 0);animation:rise .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{clip-path:inset(100% 0 0 0);transform:translateY(60px)}to{clip-path:inset(0 0 0 0);transform:none}}
.s1 .label{position:absolute;left:100px;top:150px;font:600 30px/1 system-ui,sans-serif;letter-spacing:.42em;opacity:0;animation:fade .7s ease .6s both}
.s1 .rule{position:absolute;left:100px;top:640px;width:520px;height:10px;background:#12352b;transform-origin:left;transform:scaleX(0);animation:grow .8s cubic-bezier(.7,0,.2,1) 1.1s both}
.s1 .sub{position:absolute;left:100px;top:690px;font:500 54px/1.4 "Hiragino Sans",system-ui,sans-serif;opacity:0;animation:fade .7s ease 1.4s both}
@keyframes fade{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes grow{to{transform:scaleX(1)}}
.s1 .out{animation:out .5s cubic-bezier(.7,0,.2,1) 2.25s both}
@keyframes out{to{transform:translateX(-80px);opacity:0}}
/* scene 2 (2.5–5 s): bright green, vertical Japanese crossed by horizontal Latin */
.lead{background:#ffd23f;transform-origin:left;transform:scaleX(0);animation:wipe .55s cubic-bezier(.7,0,.2,1) 2.4s both}
.s2{background:#3cc47c;transform-origin:left;transform:scaleX(0);animation:wipe .55s cubic-bezier(.7,0,.2,1) 2.5s both}
@keyframes wipe{to{transform:scaleX(1)}}
.s2 .v{position:absolute;right:120px;top:110px;writing-mode:vertical-rl;font:600 72px/1.5 "Hiragino Mincho ProN","Yu Mincho",serif;letter-spacing:.12em}
.s2 .v span{display:inline-block;opacity:0;animation:drop .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes drop{from{opacity:0;transform:translateY(-28px)}to{opacity:1;transform:none}}
.s2 .h{position:absolute;left:80px;top:300px;font:800 132px/1.02 system-ui,"Helvetica Neue",sans-serif;letter-spacing:-.02em}
.s2 .h div{overflow:hidden}
.s2 .h b{display:block;font-weight:800;transform:translateY(105%);animation:up .7s cubic-bezier(.2,.8,.2,1) both}
@keyframes up{to{transform:none}}
.s2 .bar{position:absolute;left:80px;right:300px;top:720px;height:8px;background:#12352b;transform-origin:left;transform:scaleX(0);animation:grow .7s cubic-bezier(.7,0,.2,1) 3.9s both}
.s2 .cap{position:absolute;left:80px;top:760px;font:600 30px/1 system-ui,sans-serif;letter-spacing:.32em;opacity:0;animation:fade .6s ease 4.1s both}
/* scene 3 (5–7.5 s): yellow, three lines, letter spacing settles */
.s3{background:#ffd23f;transform-origin:top;transform:scaleY(0);animation:wipeY .6s cubic-bezier(.7,0,.2,1) 5s both}
@keyframes wipeY{to{transform:scaleY(1)}}
.s3 p{position:absolute;left:96px;white-space:nowrap;opacity:0;animation:track .9s cubic-bezier(.2,.8,.2,1) both}
.s3 .l1{top:250px;font:300 110px/1 "Hiragino Sans",system-ui,sans-serif;animation-delay:5.45s}
.s3 .l2{top:420px;font:800 128px/1 "Hiragino Sans",system-ui,sans-serif;animation-delay:5.75s}
.s3 .l3{top:610px;font:600 104px/1 "Hiragino Mincho ProN","Yu Mincho",serif;animation-delay:6.05s}
@keyframes track{from{opacity:0;letter-spacing:.5em;transform:translateX(40px)}to{opacity:1;letter-spacing:.02em;transform:none}}
.s3 .dot{position:absolute;left:96px;top:820px;width:44px;height:44px;border-radius:50%;background:#3cc47c;transform:scale(0);animation:pop .5s cubic-bezier(.34,1.56,.64,1) 6.6s both}
@keyframes pop{to{transform:scale(1)}}
/* scene 4 (7.5–10 s): paper again, the drawn wordmark (held for the loop seam) */
.s4{background:#f2ecdf;clip-path:circle(0 at 50% 50%);animation:iris .8s cubic-bezier(.7,0,.2,1) 7.4s both}
@keyframes iris{to{clip-path:circle(80% at 50% 50%)}}
.mark{position:absolute;left:150px;top:340px;width:780px;height:205px}
.mark path,.mark rect{fill:none;stroke:#12352b;stroke-width:30;stroke-linecap:butt;stroke-linejoin:miter;stroke-dasharray:1;stroke-dashoffset:1;animation:draw .9s cubic-bezier(.6,0,.2,1) both}
@keyframes draw{to{stroke-dashoffset:0}}
.mark .acc{stroke:#3cc47c}
.s4 .under{position:absolute;left:150px;top:590px;width:780px;height:14px;background:#3cc47c;transform-origin:left;transform:scaleX(0);animation:grow .7s cubic-bezier(.7,0,.2,1) 8.6s both}
.s4 .tag{position:absolute;left:150px;top:640px;font:600 56px/1.3 "Hiragino Sans",system-ui,sans-serif;opacity:0;animation:fade .7s ease 8.9s both}
.s4 .sun{position:absolute;left:868px;top:290px;width:52px;height:52px;border-radius:50%;background:#ffd23f;transform:scale(0);animation:pop .5s cubic-bezier(.34,1.56,.64,1) 8.8s both}
.note{position:absolute;left:0;right:0;bottom:56px;text-align:center;font:500 26px/1 "Hiragino Sans",system-ui,sans-serif;letter-spacing:.06em;color:#12352bcc;opacity:0;animation:fade .6s ease 9.1s both}
</style></head><body>
<div class="layer s1"><div class="out" style="position:absolute;inset:0">
  <p class="label">YOMIBA · BOOK &amp; COFFEE</p>
  <p class="big" aria-label="よむ。"><span style="animation-delay:.15s">よ</span><span style="animation-delay:.32s">む</span><span style="animation-delay:.49s">。</span></p>
  <div class="rule"></div>
  <p class="sub">一冊と、一杯のあいだ。</p>
</div></div>
<div class="layer lead"></div>
<div class="layer s2">
  <p class="v" aria-label="ページの間で、ひと休み。"><span style="animation-delay:3.0s">ペ</span><span style="animation-delay:3.07s">ー</span><span style="animation-delay:3.14s">ジ</span><span style="animation-delay:3.21s">の</span><span style="animation-delay:3.28s">間</span><span style="animation-delay:3.35s">で</span><span style="animation-delay:3.42s">、</span><span style="animation-delay:3.49s">ひ</span><span style="animation-delay:3.56s">と</span><span style="animation-delay:3.63s">休</span><span style="animation-delay:3.70s">み</span><span style="animation-delay:3.77s">。</span></p>
  <div class="h"><div><b style="animation-delay:2.95s">PAUSE</b></div><div><b style="animation-delay:3.1s">BETWEEN</b></div><div><b style="animation-delay:3.25s">PAGES.</b></div></div>
  <div class="bar"></div>
  <p class="cap">OPEN 8:00 — 21:00</p>
</div>
<div class="layer s3">
  <p class="l1">本と、</p>
  <p class="l2">珈琲と、</p>
  <p class="l3">ゆっくりの時間。</p>
  <div class="dot"></div>
</div>
<div class="layer s4">
  <svg class="mark" viewBox="-20 -20 760 205" aria-label="YOMIBA" role="img">
    <path pathLength="1" d="M0 0 L50 72 L100 0 M50 72 L50 165" style="animation-delay:7.9s"/>
    <rect pathLength="1" x="128" y="0" width="100" height="165" rx="50" class="acc" style="animation-delay:8.0s"/>
    <path pathLength="1" d="M256 165 L256 0 L306 92 L356 0 L356 165" style="animation-delay:8.1s"/>
    <path pathLength="1" d="M404 0 L404 165" style="animation-delay:8.2s"/>
    <path pathLength="1" d="M452 165 L452 0 H498 A40 40 0 0 1 498 80 H452 M452 80 H506 A42.5 42.5 0 0 1 506 165 H452" style="animation-delay:8.25s"/>
    <path pathLength="1" d="M584 165 L636 0 L688 165 M604 108 H668" style="animation-delay:8.35s"/>
  </svg>
  <div class="sun"></div>
  <div class="under"></div>
  <p class="tag">本と珈琲の店（架空）</p>
</div>
<p class="note">架空のブランドによる見本 — OmochiX Design Library</p>
</body></html>
